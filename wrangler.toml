name = "generic-ai-gateway"
main = "src/index.js"
compatibility_date = "2026-11-26"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "generic-ai-gateway"
migrations_dir = "migrations"
